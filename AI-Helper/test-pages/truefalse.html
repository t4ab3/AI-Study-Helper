<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>True / False</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body><main>
<h1>Тест: верно / неверно</h1>
<form id="quiz">
  <div class="question">
    <p class="q-text">1. Вода кипит при 100 °C при нормальном давлении.</p>
    <label><input type="radio" name="tf1" value="1"> Верно</label>
    <label><input type="radio" name="tf1" value="0"> Неверно</label>
  </div>
  <div class="question">
    <p class="q-text">2. The Sun is a planet.</p>
    <label><input type="radio" name="tf2" value="true"> True</label>
    <label><input type="radio" name="tf2" value="false"> False</label>
  </div>
  <div class="nav"><button type="button" class="finish">Завершить попытку</button></div>
</form>
<div id="state"></div>
</main></body>
</html>
