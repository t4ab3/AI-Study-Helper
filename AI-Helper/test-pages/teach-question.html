<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Question text that automatic search gets wrong</title><link rel="stylesheet" href="style.css"><script src="common.js"></script>
<style>
  .card { display: none; }
  .card.active { display: block; }
  .card label { display: block; margin: 4px 0; }
  .qq-head { font: 13px system-ui, sans-serif; color: #777; }
  .qq-title { font: 600 17px system-ui, sans-serif; margin: 6px 0 14px; }
  .hint { color: #777; font-size: 13px; }
  .topbar, .navigator { font: 13px system-ui, sans-serif; color: #555; margin: 8px 0; }
  .arrow { display: inline-flex; width: 44px; height: 32px; align-items: center; justify-content: center; background: #2563eb; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body><main>
<h1>Тест, где текст вопроса стоит отдельно</h1>
<!-- site UI that looks like a question to the automatic search -->
<div class="topbar">Шрифт: <label><input type="radio" name="font" value="n" checked> обычный</label> <label><input type="radio" name="font" value="l"> крупный</label></div>
<div class="qq-head">Вопрос <span id="num">1</span> из 3</div>
<!-- the question text is rendered here, far from the answers; the answers have their own hint text -->
<div class="qq-title"><b id="qtext"></b></div>
<form onsubmit="return false">
  <div class="card" data-q="1">
    <p class="hint">Выберите один вариант из списка ниже</p>
    <label><input type="radio" name="t1" value="a"> Берлин</label>
    <label><input type="radio" name="t1" value="b"> Париж</label>
    <label><input type="radio" name="t1" value="c"> Мадрид</label>
  </div>
  <div class="card" data-q="2">
    <p class="hint">Введите ответ в поле ниже</p>
    <label for="t2">Ответ:</label>
    <input type="text" id="t2" name="t2" size="30">
  </div>
  <div class="card" data-q="3">
    <p class="hint">Отметьте все подходящие варианты</p>
    <label><input type="checkbox" name="t3_0"> 2</label>
    <label><input type="checkbox" name="t3_1"> 4</label>
    <label><input type="checkbox" name="t3_2"> 7</label>
    <label><input type="checkbox" name="t3_3"> 9</label>
  </div>
  <div class="nav">
    <!-- "Next" is an arrow icon without any text: the automatic search cannot find it -->
    <div id="next" class="arrow"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M5 2l8 7-8 7" stroke="#fff" stroke-width="2.5" fill="none"/></svg></div>
    <button type="button" class="finish" style="display:none">Завершить тест</button>
  </div>
</form>
<div class="navigator">К вопросу: <label><input type="radio" name="goto" value="1"> 1</label> <label><input type="radio" name="goto" value="2"> 2</label> <label><input type="radio" name="goto" value="3"> 3</label></div>
<div id="state"></div>
<script>
  const TEXTS = ['Столица Франции?', 'Столица Италии?', 'Какие из чисел простые?'];
  const cards = Array.from(document.querySelectorAll('.card'));
  const next = document.getElementById('next');
  const finish = document.querySelector('.finish');
  let current = 0;
  function show(i) {
    cards.forEach((c, k) => c.classList.toggle('active', k === i));
    document.getElementById('qtext').textContent = TEXTS[i];
    document.getElementById('num').textContent = i + 1;
    const last = i === cards.length - 1;
    next.style.display = last ? 'none' : '';
    finish.style.display = last ? '' : 'none';
  }
  next.addEventListener('click', () => {
    if (current >= cards.length - 1) return;
    current++;
    cards.forEach((c) => c.classList.remove('active'));
    setTimeout(() => show(current), 400);
  });
  show(0);
</script>
</main></body>
</html>
